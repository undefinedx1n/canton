# 复用服务器已有 nginx，按公网 IP 直接访问第一版（无域名 / 无证书）
# 安装：cp deploy/nginx-ip.conf /etc/nginx/conf.d/scheduler.conf && nginx -t && systemctl reload nginx
# 注意：server_name 用真实公网 IP；若已绑定域名，把域名加进 server_name（空格分隔）
server {
    listen 80;
    listen [::]:80;
    server_name 8.217.198.163;

    # Excel 导入/导出
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/scheduler.access.log;
    error_log  /var/log/nginx/scheduler.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # 排班求解（CP-SAT）最长 20s，留足余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
