# 游乐园人员排班系统 —— nginx 反代配置（域名 + IP 双入口）
#
# 安装：cp deploy/nginx-scheduler.conf /etc/nginx/conf.d/scheduler.conf
#       nginx -t && systemctl reload nginx
# 证书：canton.1gavin.online 由 Certbot 管理（本文件 443 段是 certbot --nginx 自动写入的产物，
#       后续改动请以服务器 /etc/nginx/conf.d/scheduler.conf 为准，改动后跑 nginx -t 再 reload）

# ---------- 域名入口：canton.1gavin.online ----------
server {
    listen 80;
    listen [::]:80;
    server_name canton.1gavin.online;

    # ACME 校验目录（证书续期走 webroot 时用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余请求由 certbot --redirect 写入 301 跳转（见文件末尾）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    # IPv6 不重复声明 ipv6only（同机 api.1gavin.online 已占用该参数），否则 nginx 报 duplicate listen options
    listen [::]:443 ssl;
    server_name canton.1gavin.online;

    # 证书由 certbot 维护，续期后 nginx 自动加载（certbot-renew.timer 每日检查）
    ssl_certificate     /etc/letsencrypt/live/canton.1gavin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canton.1gavin.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Excel 导入/导出
    client_max_body_size 20m;

    # 静态资源压缩（前端为 Next.js 静态导出，JS/CSS 体积较大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/scheduler.access.log;
    error_log  /var/log/nginx/scheduler.error.log;

    # 带 hash 的构建产物可以长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # 排班求解（CP-SAT）最长 20s，留足余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}

# ---------- IP 入口：8.217.198.163（保留，便于运维直连排查） ----------
